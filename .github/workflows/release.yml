name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          dotnet publish -p:PublishProfile=win-x64 -p:Version=$version

      - name: Zip the build
        shell: pwsh
        run: Compress-Archive -Path bin/publish/win-x64/* -DestinationPath SysVue-${{ github.ref_name }}-win-x64.zip

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: SysVue-${{ github.ref_name }}-win-x64.zip
          generate_release_notes: true