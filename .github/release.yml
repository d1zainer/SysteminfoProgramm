# Shapes the notes GitHub generates for a release (generate_release_notes in
# .github/workflows/release.yml). Merged PRs are grouped by their labels;
# the catch-all "*" must stay last.
changelog:
  exclude:
    labels:
      - no-release-note
  categories:
    - title: Features
      labels:
        - feature
        - enhancement
    - title: Fixes
      labels:
        - bug
        - fix
    - title: UI
      labels:
        - ui
    - title: Internal
      labels:
        - refactor
        - chore
        - ci
        - build
        - docs
    - title: Other
      labels:
        - "*"